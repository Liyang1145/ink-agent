<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="lib/katex/katex.min.css">
<script src="lib/katex/katex.min.js"></script>
<script src="lib/markdown-it.min.js"></script>
<style>
:root{--fg:#1d1f24;--muted:#7a808c;--line:#e3e6ec;--user:#e6efff;--accent:#1e78ff;}
html,body{margin:0;padding:0;background:#fafbfc;color:var(--fg);font:15px/1.6 -apple-system,"Noto Sans SC",sans-serif;}
#log{padding:10px 12px 40px;}
.msg{margin:10px 0;}
.user{background:var(--user);border-radius:12px;padding:8px 12px;margin-left:24px;white-space:pre-wrap;word-break:break-word;}
.user img{max-width:100%;max-height:180px;border:1px solid #c9d6f2;border-radius:6px;display:block;margin:4px 0;background:#fff;}
.asst{padding:2px 2px;}
.md{word-break:break-word;}
.md p{margin:.45em 0;}
.md pre{background:#f1f3f6;padding:8px 10px;border-radius:6px;overflow-x:auto;font-size:13px;}
.md code{background:#f1f3f6;padding:1px 4px;border-radius:4px;font-size:13px;}
.md pre code{background:none;padding:0;}
.md table{border-collapse:collapse;}
.md td,.md th{border:1px solid var(--line);padding:3px 8px;}
.md blockquote{margin:.4em 0;padding-left:10px;border-left:3px solid var(--line);color:#555;}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0;}
.math-err{color:#cc0000;font-family:monospace;}
details.think{color:var(--muted);font-size:13px;margin:4px 0;border-left:2px solid var(--line);padding-left:8px;}
details.think summary{cursor:pointer;outline:none;}
details.think .body{white-space:pre-wrap;}
.tool{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;background:#fff;}
.tool .name{font-weight:600;color:#333;}
.tool .st{float:right;color:var(--muted);}
.tool.err .st{color:#c62828;}
.tool pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto;font-size:12px;color:#555;}
.tool img{max-width:100%;max-height:160px;display:block;margin-top:4px;border:1px solid var(--line);}
.notice{color:var(--muted);font-size:13px;text-align:center;margin:8px 0;}
.notice.err{color:#c62828;}
.cursor:after{content:"▍";color:var(--accent);animation:b 1s steps(1) infinite;}
@keyframes b{50%{opacity:0}}
</style></head>
<body><div id="log"></div>
<script>
var md = window.markdownit({html:false, linkify:true, breaks:true});
var log = document.getElementById('log');
var msgs = {};   // id -> {el, text, reasoning, frozen:[{src,html}], textEl, thinkEl}
var tools = {};  // callId -> {el, args}

function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function scrollEnd(){ window.scrollTo(0, document.body.scrollHeight); }

// --- dsh ui-primitives/markdown/katex.tsx: strict → strict:'ignore' → error span
function tex(src, display){
  try { return katex.renderToString(src,{displayMode:display,throwOnError:true}); }
  catch(e){
    try { return katex.renderToString(src,{displayMode:display,strict:'ignore',throwOnError:false}); }
    catch(e2){ return '<span class="math-err">'+esc(src)+'</span>'; }
  }
}

// --- dsh parse.ts parseGfmWithMath + mathCompatibility: $$..$$, \[..\], $..$, \(..\)
function renderWithMath(src){
  var maths = [];
  var out = '', i = 0;
  // protect fenced code and inline code from math extraction
  var parts = src.split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`)/);
  for (var p=0; p<parts.length; p++){
    var s = parts[p];
    if (p % 2 === 1) { out += s; continue; }
    s = s.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?!\s)([^$\n]+?)\$(?!\d)/g,
      function(m, a, b, c, d){
        var display = (a !== undefined || b !== undefined);
        var body = a !== undefined ? a : b !== undefined ? b : c !== undefined ? c : d;
        if (d !== undefined && /\s$/.test(d)) return m;
        maths.push(tex(body.trim(), display));
        var token = 'MATHTOKEN' + (maths.length-1) + 'X';
        return display ? '\n\n' + token + '\n\n' : token;
      });
    out += s;
  }
  var html = md.render(out);
  html = html.replace(/<p>MATHTOKEN(\d+)X<\/p>/g, function(m,n){ return maths[+n]; });
  html = html.replace(/MATHTOKEN(\d+)X/g, function(m,n){ return maths[+n]; });
  return html;
}
// streaming arm: GFM without math so half-written TeX never flashes errors
function renderPlain(src){ return md.render(src); }

// split into top-level blocks at blank lines outside code fences
function blocks(src){
  var lines = src.split('\n'), out = [], cur = [], fence = false, inMath = false;
  for (var i=0;i<lines.length;i++){
    var l = lines[i];
    if (/^\s*```/.test(l)) fence = !fence;
    var c = (l.match(/\$\$/g)||[]).length; if (!fence && c % 2 === 1) inMath = !inMath;
    if (!fence && !inMath && l.trim()==='' && cur.length){ out.push(cur.join('\n')); cur=[]; continue; }
    cur.push(l);
  }
  if (cur.length) out.push(cur.join('\n'));
  return out;
}

// --- dsh incremental.ts: freeze all but the trailing two blocks; re-render only the tail
function paint(m, settled){
  var bs = blocks(m.text);
  var stable = settled ? bs.length : Math.max(0, bs.length - 2);
  var html = '';
  for (var i=0;i<bs.length;i++){
    if (i < stable){
      if (!m.frozen[i] || m.frozen[i].src !== bs[i]) m.frozen[i] = {src:bs[i], html:renderWithMath(bs[i])};
      html += m.frozen[i].html;
    } else {
      html += renderPlain(bs[i]);
    }
  }
  m.textEl.innerHTML = html;
  m.textEl.className = 'md' + (settled ? '' : ' cursor');
}

function addUser(id, text, imgs){
  var d = document.createElement('div'); d.className='msg user';
  (imgs||[]).forEach(function(u){ var im=document.createElement('img'); im.src=u; d.appendChild(im); });
  if (text){ var t=document.createElement('div'); t.textContent=text; d.appendChild(t); }
  log.appendChild(d); scrollEnd();
}
function startAssistant(id){
  var d = document.createElement('div'); d.className='msg asst';
  log.appendChild(d);
  msgs[id] = {el:d, text:'', reasoning:'', frozen:[], textEl:null, thinkEl:null};
  return msgs[id];
}
function ensureText(m){
  if (!m.textEl){ m.textEl=document.createElement('div'); m.textEl.className='md cursor'; m.el.appendChild(m.textEl); }
}
function appendReasoning(id, t){
  var m = msgs[id] || startAssistant(id);
  if (!m.thinkEl){
    var det=document.createElement('details'); det.className='think'; det.open=true;
    det.innerHTML='<summary>思考</summary><div class="body"></div>';
    m.el.insertBefore(det, m.el.firstChild); m.thinkEl=det;
  }
  m.reasoning += t; m.thinkEl.querySelector('.body').textContent = m.reasoning;
  scrollEnd();
}
function appendText(id, t){
  var m = msgs[id] || startAssistant(id);
  ensureText(m); m.text += t; paint(m, false); scrollEnd();
}
function setText(id, t){
  var m = msgs[id] || startAssistant(id);
  ensureText(m); m.text = t; paint(m, true);
}
function settle(id){
  var m = msgs[id]; if (!m) return;
  if (m.thinkEl) m.thinkEl.open = false;
  if (m.textEl) paint(m, true);
  if (!m.textEl && !m.thinkEl && m.el.children.length===0) m.el.remove();
  scrollEnd();
}
function toolStart(id, callId, name){
  var m = msgs[id] || startAssistant(id);
  if (m.textEl){ paint(m, true); m.textEl = null; m.text=''; m.frozen=[]; }
  var d=document.createElement('div'); d.className='tool';
  d.innerHTML='<span class="name"></span><span class="st">运行中…</span><pre class="args"></pre>';
  d.querySelector('.name').textContent = '🔧 ' + name;
  m.el.appendChild(d); tools[callId]={el:d, args:''}; scrollEnd();
}
function toolArgs(callId, delta){
  var t=tools[callId]; if(!t) return; t.args+=delta;
  t.el.querySelector('.args').textContent = t.args.length>600 ? t.args.slice(0,600)+'…' : t.args;
}
function toolResult(callId, text, isError, img){
  var t=tools[callId]; if(!t) return;
  t.el.querySelector('.st').textContent = isError ? '失败' : '完成';
  if (isError) t.el.className='tool err';
  if (text){ var p=document.createElement('pre'); p.textContent = text.length>800 ? text.slice(0,800)+'…' : text; t.el.appendChild(p); }
  if (img){ var im=document.createElement('img'); im.src=img; t.el.appendChild(im); }
  scrollEnd();
}
function notice(text, isError){
  var d=document.createElement('div'); d.className='notice'+(isError?' err':''); d.textContent=text; log.appendChild(d); scrollEnd();
}
function clearAll(){ log.innerHTML=''; msgs={}; tools={}; }
</script></body></html>
