<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="lib/katex/katex.min.css">
<script src="lib/katex/katex.min.js"></script>
<script src="lib/markdown-it.min.js"></script>
<style>
:root{
  --label-1:#1f2329; --label-2:#4e5561; --label-3:#8a8f99; --label-4:#b5b9c1;
  --border:#e6e8eb; --border-2:#eef0f2; --fill:#f5f6f7; --fill-2:#eceef1;
  --accent:#4d6bfe; --danger:#d93025; --bg:#ffffff;
  --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--label-1);
  font:15px/1.65 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent;}
/* the WebView's viewport height can go stale (laid out while tiny / re-parented); the host pushes its real
   height into --vh on every size change, so the column never collapses to header+composer */
body{display:flex;flex-direction:column;height:var(--vh,100%);min-height:0;}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
/* ---------- header ---------- */
#hdr{flex:none;display:flex;align-items:center;gap:4px;height:44px;padding:0 8px 0 12px;border-bottom:.5px solid var(--border);}
#title{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--label-1);text-align:left;}
#title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--label-2);}
.icon-btn:active{background:var(--fill-2);}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
/* ---------- transcript ---------- */
#scroll{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
#log{padding:12px 14px 24px;max-width:860px;margin:0 auto;}
.empty{color:var(--label-3);text-align:center;margin-top:30%;font-size:14px;}
.turn{margin:0 0 18px;}
.user-row{display:flex;justify-content:flex-end;margin:6px 0 10px;}
.user{max-width:88%;background:var(--fill);border-radius:14px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;}
.user .imgs{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px;justify-content:flex-end;}
.user .imgs img{max-height:120px;max-width:200px;border-radius:8px;border:.5px solid var(--border);background:#fff;display:block;}
.user.steer{border:1px dashed var(--label-4);background:#fff;}
.user .tag{font-size:12px;color:var(--label-3);display:block;}
/* process (work steps) */
.proc-btn{display:flex;align-items:center;width:100%;height:33px;padding:0 0 8px;margin-bottom:8px;border-bottom:.5px solid var(--border);
  color:var(--label-3);font-size:14px;text-align:left;}
.proc-btn .chev{width:14px;height:14px;margin-left:4px;transition:transform .1s;}
.proc-btn[data-open] .chev{transform:rotate(180deg);}
.proc-btn.failed{color:var(--danger);}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.proc-body{margin:0 0 6px;}
.proc-body[hidden]{display:none;}
.grp{margin:2px 0;}
.grp-h{display:flex;align-items:center;gap:4px;color:var(--label-3);font-size:14px;line-height:26px;text-align:left;width:100%;}
.grp-h .chev{width:12px;height:12px;transition:transform .1s;transform:rotate(-90deg);}
.grp-h[data-open] .chev{transform:none;}
.grp-h.live{color:var(--label-2);}
.grp-b{padding:2px 0 6px 10px;margin-left:5px;border-left:1px solid var(--border-2);}
.grp-b[hidden]{display:none;}
.think{color:var(--label-3);font-size:13.5px;}
.think-h{display:flex;align-items:center;gap:4px;line-height:24px;color:var(--label-3);text-align:left;width:100%;min-width:0;}
.think-h span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.think-h .chev{flex:none;}
.think-h .chev{width:12px;height:12px;transform:rotate(-90deg);transition:transform .1s;}
.think-h[data-open] .chev{transform:none;}
.think-b{white-space:pre-wrap;word-break:break-word;padding:2px 0 4px;}
.think-b[hidden]{display:none;}
.mid-text{margin:2px 0 4px;color:var(--label-2);}
.tool{margin:3px 0;font-size:13.5px;}
.tool-h{display:flex;align-items:center;gap:6px;line-height:24px;color:var(--label-2);width:100%;text-align:left;min-width:0;}
.tool-h .dot{width:6px;height:6px;border-radius:3px;background:var(--label-4);flex:none;}
.tool.ok .dot{background:#2fb36b;} .tool.err .dot{background:var(--danger);} .tool.run .dot{background:var(--accent);animation:pulse 1s infinite;}
.tool-h .nm{flex:none;}
.tool-h .arg{color:var(--label-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-family:var(--mono);font-size:12px;}
.tool-b{padding:2px 0 6px 12px;}
.tool-b[hidden]{display:none;}
.tool-b pre{margin:2px 0;background:var(--fill);border-radius:6px;padding:6px 8px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;color:var(--label-2);}
.tool-b img{max-width:100%;max-height:200px;border:.5px solid var(--border);border-radius:6px;display:block;margin-top:4px;background:#fff;}
@keyframes pulse{50%{opacity:.35}}
/* answer markdown */
.md{word-break:break-word;}
.md p{margin:.5em 0;}
.md>:first-child{margin-top:0;} .md>:last-child{margin-bottom:0;}
.md h1,.md h2,.md h3{font-size:1.08em;margin:.9em 0 .4em;}
.md ul,.md ol{padding-left:1.4em;margin:.4em 0;}
.md pre{background:var(--fill);padding:8px 10px;border-radius:8px;overflow-x:auto;font:12.5px/1.5 var(--mono);}
.md code{background:var(--fill);padding:1px 4px;border-radius:4px;font:12.5px var(--mono);}
.md pre code{background:none;padding:0;}
.md table{border-collapse:collapse;margin:.5em 0;display:block;overflow-x:auto;}
.md td,.md th{border:.5px solid var(--border);padding:4px 8px;}
.md blockquote{margin:.5em 0;padding-left:10px;border-left:3px solid var(--border);color:var(--label-2);}
.md a{color:var(--accent);text-decoration:none;}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0;margin:.5em 0;}
.math-err{color:var(--danger);font-family:var(--mono);font-size:13px;}
.streaming>:last-child::after{content:"";display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--label-1);margin-left:4px;vertical-align:middle;animation:pulse 1s infinite;}
.running{display:flex;align-items:center;gap:6px;color:var(--label-3);font-size:14px;margin:6px 0;}
.running .whale{width:8px;height:8px;border-radius:4px;background:var(--accent);animation:pulse 1s infinite;}
.notice{color:var(--label-3);font-size:13px;margin:6px 0;}
.notice.err{color:var(--danger);}
/* ---------- composer (rounded card, + menu, / commands, model on the right) ---------- */
#composer{flex:none;padding:4px 12px 8px;position:relative;}
#box{border:1px solid #e3e6eb;border-radius:22px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04);padding:12px 12px 8px 16px;}
#box:focus-within{border-color:#cdd5f6;}
#tray{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;}
#tray:empty{display:none;}
.att{position:relative;flex:none;}
.att img{height:64px;max-width:140px;border-radius:10px;border:.5px solid var(--border);display:block;background:#fff;object-fit:contain;}
.att .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;text-align:center;}
#input{width:100%;border:none;outline:none;resize:none;font:inherit;font-size:15px;line-height:1.55;max-height:180px;min-height:46px;padding:0 2px;color:var(--label-1);background:transparent;}
#input::placeholder{color:#b4b8bf;}
#bar{display:flex;align-items:center;gap:6px;margin-top:6px;}
#plus{width:36px;height:36px;border-radius:18px;background:#f2f3f5;display:inline-flex;align-items:center;justify-content:center;flex:none;}
#plus svg{width:18px;height:18px;stroke:var(--label-1);stroke-width:1.9;}
#plus:active,#plus.on{background:#e6e8ec;}
.chip{height:32px;padding:0 8px;border-radius:16px;font-size:13.5px;color:var(--label-2);display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:calc(100% - 96px);}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip em{font-style:normal;color:#a3a8b0;flex:none;}
.chip:active{background:var(--fill-2);}
.spacer{flex:1;}
#send,#stop{width:38px;height:38px;border-radius:19px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;}
#send:disabled{background:#c9d2fd;}
#send svg{stroke:#fff;width:17px;height:17px;stroke-width:2.3;}
#stop{display:none;}
#stop i{width:11px;height:11px;border-radius:2.5px;background:#fff;display:block;}
body.busy #stop{display:inline-flex;}
body.busy #send:disabled{display:none;}
#hint{font-size:11.5px;color:var(--label-4);text-align:center;margin-top:4px;display:none;}
body.busy #hint{display:block;}
/* popup menus (+ and /) */
.pop{position:absolute;left:14px;bottom:calc(100% - 2px);min-width:220px;max-width:calc(100% - 28px);background:#fff;border:.5px solid #e3e6eb;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:6px;display:none;z-index:6;}
.pop.open{display:block;}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--label-1);text-align:left;}
.pop .mi:active,.pop .mi.sel{background:var(--fill-2);}
.pop .mi .k{width:22px;text-align:center;flex:none;color:var(--label-2);font-size:15px;}
.pop .mi small{margin-left:auto;color:var(--label-4);font-size:12px;padding-left:10px;white-space:nowrap;}
.pop .ttl{font-size:12px;color:var(--label-4);padding:4px 10px 2px;}
/* ---------- session sidebar (dsh ui-sidebar session list) ---------- */
#side{position:fixed;inset:0;z-index:8;display:none;}
#side.open{display:block;}
#side .scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);}
#side .drawer{position:absolute;left:0;top:0;bottom:0;width:min(300px,86%);background:#fafbfc;border-right:.5px solid var(--border);display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.06);}
#side .sh{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 14px;font-size:14px;font-weight:600;}
#side .sh span{flex:1;}
#side .search{margin:2px 10px 8px;height:32px;border:.5px solid var(--border);border-radius:8px;padding:0 10px;font:inherit;font-size:13.5px;background:#fff;outline:none;}
#side .newbtn{margin:0 10px 8px;height:34px;border-radius:8px;background:#fff;border:.5px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:13.5px;color:var(--label-1);}
#side .list{flex:1;overflow-y:auto;padding:0 6px 10px;}
#side .grp-t{font-size:12px;color:var(--label-3);padding:8px 8px 4px;}
.srow{display:flex;align-items:center;gap:4px;border-radius:8px;padding:0 4px 0 8px;height:36px;font-size:13.5px;color:var(--label-1);}
.srow.cur{background:var(--fill-2);font-weight:500;}
.srow .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;height:36px;}
.srow .pin{width:12px;height:12px;color:var(--label-3);flex:none;}
.srow .more{width:28px;height:28px;border-radius:6px;color:var(--label-3);flex:none;}
.smenu{position:fixed;z-index:10;background:#fff;border:.5px solid var(--border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:4px;min-width:120px;}
.smenu button{display:block;width:100%;text-align:left;padding:7px 12px;border-radius:6px;font-size:13.5px;}
.smenu button.danger{color:var(--danger);}
.smenu button:active{background:var(--fill-2);}
/* modal (rename / delete confirm) */
#modal{position:fixed;inset:0;z-index:11;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;}
#modal .box{background:#fff;border-radius:14px;padding:16px;width:min(320px,88%);box-shadow:0 10px 30px rgba(0,0,0,.15);}
#modal .t{font-weight:600;margin-bottom:10px;}
#modal input{width:100%;height:34px;border:.5px solid #d9dce1;border-radius:8px;padding:0 10px;font:inherit;outline:none;}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
#modal .acts button{height:32px;padding:0 14px;border-radius:8px;font-size:13.5px;}
#modal .acts .ok{background:var(--accent);color:#fff;}
#modal .acts .ok.danger{background:var(--danger);}
/* ---------- footer stats pills ---------- */
#stats{display:flex;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;gap:2px;justify-content:center;font-size:12px;color:var(--label-3);margin-top:8px;line-height:1;}
#stats:empty{display:none;}
#stats .pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:8px;flex:none;}
#stats .pill:first-child{background:#f2f3f5;}
#stats .pill svg{width:15px;height:15px;stroke:var(--label-3);stroke-width:1.7;fill:none;flex:none;}
#stats .ring{width:16px;height:16px;flex:none;}
#statsMore{display:none;font-size:11.5px;color:var(--label-4);text-align:center;margin-top:4px;line-height:1.5;}
#statsMore.open{display:block;}
/* ---------- confirm card (provider changes) ---------- */
.ccard{border:.5px solid #c9d2fd;background:#f6f8ff;border-radius:12px;padding:10px 12px;margin:8px 0;}
.ccard .ct{font-weight:600;font-size:14px;margin-bottom:6px;}
.ccard table{border-collapse:collapse;font-size:13px;width:100%;}
.ccard td{padding:2px 0;vertical-align:top;word-break:break-all;}
.ccard td:first-child{color:var(--label-3);white-space:nowrap;padding-right:10px;width:1%;}
.ccard .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.ccard .acts button{height:30px;padding:0 14px;border-radius:8px;font-size:13px;border:.5px solid var(--border);background:#fff;}
.ccard .acts .ok{background:var(--accent);color:#fff;border-color:var(--accent);}
.ccard .res{font-size:12.5px;color:var(--label-3);margin-top:6px;}
/* image preview */
#pv{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:9;}
#pv img{max-width:94%;max-height:94%;background:#fff;border-radius:6px;}
</style></head>
<body>
<div id="hdr">
  <button class="icon-btn" title="会话列表" aria-label="会话列表" onclick="openSide()"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <button id="title" onclick="openSide()"><span id="titleText">新对话</span>
    <svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg></button>
  <button class="icon-btn" title="新对话" aria-label="新对话" onclick="Native.newSession()"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
  <button class="icon-btn" title="设置" aria-label="设置" onclick="Native.openSettings()"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  <button class="icon-btn" id="capBtn" title="框选截屏" aria-label="框选截屏" onclick="Native.capture()" style="display:none"><svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><path d="M9 12h6M12 9v6"/></svg></button>
  <button class="icon-btn" id="modeBtn" title="划分领土" aria-label="划分领土" onclick="Native.toggleMode()"><svg class="i" id="modeIco" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg></button>
  <button class="icon-btn" title="最小化" aria-label="最小化" onclick="Native.collapse()"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
</div>
<div id="scroll"><div id="log"></div></div>
<div id="composer">
  <div class="pop" id="plusMenu">
    <button class="mi" onclick="closePops();insertRef()"><span class="k">@</span>引用当前页<small>@N</small></button>
    <button class="mi" onclick="closePops();Native.pickImage()"><span class="k">🖼</span>从相册添加图片</button>
    <button class="mi" id="miCap" onclick="closePops();Native.capture()"><span class="k">⛶</span>框选截屏</button>
    <button class="mi" onclick="closePops();startSlash()"><span class="k">/</span>指令<small>批改 · 提示 · 讲解…</small></button>
    <button class="mi" onclick="closePops();Native.exportSession('')"><span class="k">⇪</span>导出会话日志<small>发给开发者分析</small></button>
  </div>
  <div class="pop" id="slashMenu"></div>
  <div id="box">
    <div id="tray"></div>
    <textarea id="input" aria-label="消息输入框" rows="2" placeholder="发消息，/ 调用指令，@ 引用页面"></textarea>
    <div id="bar">
      <button id="plus" title="更多" aria-label="更多" onclick="togglePlus()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="spacer"></div>
      <button class="chip" id="model" onclick="Native.openModel()"><span id="modelText">模型</span><em id="modelEffort"></em>
        <svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px;flex:none"><path d="M6 9l6 6 6-6"/></svg></button>
      <button id="stop" title="停止生成" aria-label="停止生成" onclick="Native.stop()"><i></i></button>
      <button id="send" title="发送消息" aria-label="发送消息" onclick="send()" disabled><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
  <div id="hint">运行中发送 = 插话，下一步生效</div>
  <div id="stats" onclick="document.getElementById('statsMore').classList.toggle('open')"></div>
  <div id="statsMore"></div>
</div>
<div id="side"><div class="scrim" onclick="closeSide()"></div><div class="drawer">
  <div class="sh"><span>会话</span><button class="icon-btn" aria-label="关闭会话列表" onclick="closeSide()"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <input class="search" id="sq" placeholder="搜索会话" oninput="renderSessions()">
  <button class="newbtn" onclick="closeSide();Native.newSession()"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M12 5v14M5 12h14"/></svg>新对话</button>
  <div class="list" id="slist"></div>
</div></div>
<div id="modal"><div class="box"><div class="t"></div><div class="body"></div><div class="acts"><button class="cancel">取消</button><button class="ok">确定</button></div></div></div>
<div id="pv" onclick="this.style.display='none'"><img></div>
<script>
// ======================= markdown + math (dsh ui-primitives/markdown) =======================
var md = window.markdownit({html:false, linkify:true, breaks:true});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function tex(src, display){
  try { return katex.renderToString(src,{displayMode:display,throwOnError:true}); }
  catch(e){
    try { return katex.renderToString(src,{displayMode:display,strict:'ignore',throwOnError:false}); }
    catch(e2){ return '<span class="math-err">'+esc(src)+'</span>'; }
  }
}
function renderWithMath(src){
  var maths=[], out='';
  var parts=src.split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`)/);
  for (var p=0;p<parts.length;p++){
    var s=parts[p];
    if (p%2===1){ out+=s; continue; }

  done:{thinking:'已完成分析',readImage:'已查看画布',write:'已写入画布',webSearch:'已搜索网页',webFetch:'已访问网页',tools:'已调用工具'}

// processTitle(): top three categories, "{first}并{second}" with shared 已 prefix
function processTitle(kinds){
  var counts={}, order=[];
  kinds.forEach(function(k){ if(!(k in counts)){counts[k]=0;order.push(k);} counts[k]++; });
  order.sort(function(a,b){return counts[b]-counts[a];});
  var labels=order.slice(0,3).map(function(k){return L.done[k];});
  if (!labels.length) return L.done.thinking;
  if (labels.length===1) return labels[0];

}

    if(s.pinned) el('span','',r,'<svg class="i pin" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 3 3H7l3-3z"/></svg>');
    var b=el('button','st',r); b.textContent=s.title; b.onclick=function(){ closeSide(); Native.openSession(s.id); };
    var m=el('button','more',r,'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>');
    m.setAttribute('aria-label','会话操作'); m.onclick=function(ev){ ev.stopPropagation(); sessionMenu(s, m); };
  });
}
var menuEl=null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl=null; } }
function sessionMenu(s, anchor){
  closeMenu(); var r=anchor.getBoundingClientRect();
  menuEl=el('div','smenu',document.body); menuEl.style.left=Math.min(r.left, window.innerWidth-140)+'px'; menuEl.style.top=(r.bottom+2)+'px';
  var a=el('button','',menuEl); a.textContent=s.pinned?'取消置顶':'置顶'; a.onclick=function(){ closeMenu(); Native.pinSession(s.id,!s.pinned); };
  var b=el('button','',menuEl); b.textContent='重命名'; b.onclick=function(){ closeMenu(); modal('重命名会话', s.title, false, function(v){ Native.renameSession(s.id, v); }); };
  var ex=el('button','',menuEl); ex.textContent='导出日志'; ex.onclick=function(){ closeMenu(); Native.exportSession(s.id); };
  var c=el('button','danger',menuEl); c.textContent='删除'; c.onclick=function(){ closeMenu(); modal('删除会话「'+s.title+'」？', null, true, function(){ Native.deleteSession(s.id); }); };
}
document.addEventListener('click', function(e){ if(menuEl && !menuEl.contains(e.target)) closeMenu(); });
function modal(title, value, danger, onOk){
  var m=document.getElementById('modal'); m.querySelector('.t').textContent=title;
  var body=m.querySelector('.body'); body.innerHTML='';
  var inp=null; if(value!==null){ inp=el('input','',body); inp.value=value; setTimeout(function(){inp.focus();inp.select();},50); }
  else body.textContent='删除后不可恢复。';
  var ok=m.querySelector('.ok'); ok.className='ok'+(danger?' danger':''); ok.textContent=danger?'删除':'确定';
  ok.onclick=function(){ m.style.display='none'; onOk(inp?inp.value:null); };
  m.querySelector('.cancel').onclick=function(){ m.style.display='none'; };
  m.style.display='flex';
}

// ======================= footer stats =======================
function fmtN(n){ if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'M'; if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1)+'K'; return String(n); }
function setStats(d){
  var box=document.getElementById('stats'), more=document.getElementById('statsMore');
  if(!d||!d.calls){ box.innerHTML=''; more.innerHTML=''; return; }
  function pct(h,i){ return i? Math.round(h*100/i)+'%' : '0%'; }
  var cost=function(c,known){ return c==null?'—':('¥'+(c<0.01?c.toFixed(4):c.toFixed(3))+(known?'':'+')); };
  var ctx=d.window?Math.min(100,Math.max(0.1,Math.round(d.context*1000/d.window)/10)):0;
  var C=2*Math.PI*6, dash=(C*ctx/100).toFixed(2)+' '+C.toFixed(2);
  var p1='<span class="pill"><svg viewBox="0 0 24 24"><path d="M4.5 16a8 8 0 1115 0"/><path d="M12 15l3.5-4.5"/></svg>'+(d.turns||1)+' 轮 '+(d.steps||0)+' 步'+(d.tps?' · '+Math.round(d.tps)+' tok/s':'')+'</span>';
  var p2='<span class="pill"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/></svg>'+fmtN(d.session.input+d.session.output)+' tok · 缓存命中 '+pct(d.session.cacheHit,d.session.input)+'</span>';
  var p3='<span class="pill" title="上下文占用"><svg class="ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" stroke="#e3e6eb" stroke-width="2.4" fill="none"/><circle cx="8" cy="8" r="6" stroke="'+(ctx>80?'#e53935':'#9aa0a8')+'" stroke-width="2.4" fill="none" stroke-dasharray="'+dash+'" transform="rotate(-90 8 8)" stroke-linecap="round"/></svg>'+ctx+'%</span>';
  box.innerHTML=p1+p2+p3;
  var parts=[];
  if(d.turn) parts.push('本轮 输入 '+fmtN(d.turn.input)+' 输出 '+fmtN(d.turn.output)+' 缓存命中 '+pct(d.turn.cacheHit,d.turn.input)+' '+cost(d.turn.cost,d.turn.known));
  parts.push('会话 输入 '+fmtN(d.session.input)+' 输出 '+fmtN(d.session.output)+' 费用 '+cost(d.session.cost,d.session.known));
  parts.push('上下文 '+fmtN(d.context)+' / '+fmtN(d.window));
  more.innerHTML=parts.join('<br>');
}

// ======================= confirm card =======================
var confirms={};
function showConfirm(id, title, lines){
  var host=turn?turn.answer:log; var e=log.querySelector('.empty'); if(e) e.remove();
  var c=el('div','ccard',turn?turn.tail:log);
  el('div','ct',c).textContent=title;
  var tb=el('table','',c); lines.forEach(function(l){ var tr=el('tr','',tb); el('td','',tr).textContent=l[0]; el('td','',tr).textContent=l[1]; });
  var acts=el('div','acts',c);
  var no=el('button','',acts); no.textContent='取消'; var ok=el('button','ok',acts); ok.textContent='确认修改';
  no.onclick=function(){ Native.confirmResult(id,false); }; ok.onclick=function(){ Native.confirmResult(id,true); };
  confirms[id]=c; end();
}
function resolveConfirm(id, ok){ var c=confirms[id]; if(!c) return; var a=c.querySelector('.acts'); if(a) a.remove(); el('div','res',c).textContent=ok?'已确认，修改已生效':'已取消，配置没有变化'; delete confirms[id]; }
function maskArgs(name, raw){
  if(name!=='manage_provider') return raw;
  try{ var a=JSON.parse(raw); if(a.api_key){ var k=String(a.api_key); a.api_key=k.length>8?k.slice(0,3)+'…'+k.slice(-4):'••••'; } return JSON.stringify(a); }catch(e){ return raw.replace(/("api_key"\s*:\s*")[^"]*/,'$1••••'); }
}
