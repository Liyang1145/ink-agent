<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="lib/katex/katex.min.css">

<style>

</style>
<script src="geo.js"></script></head>
<body><div id="box"></div>
<script>
/* InkAgent off-screen renderer: latex | svg | plot.

var SVGNS='http://www.w3.org/2000/svg';
var diag;
function note(s){diag.notes.push(s);}

function texToHtml(src){
  try { return katex.renderToString(src,{displayMode:true,throwOnError:true}); }
  catch(e){
    try { warn('LaTeX 有语法问题，已尽量渲染：'+String(e.message||e).slice(0,120));
          return katex.renderToString(src,{displayMode:true,strict:'ignore',throwOnError:false}); }
    catch(e2){ var d=document.createElement('span'); d.className='err'; d.textContent=src; return d.outerHTML; }

}

/* ---------- math expressions for plot ---------- */
var M={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,arcsin:Math.asin,arccos:Math.acos,arctan:Math.atan,
  sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp,ln:Math.log,log:Math.log,lg:Math.log10,log2:Math.log2,
  floor:Math.floor,ceil:Math.ceil,round:Math.round,sign:Math.sign,min:Math.min,max:Math.max,pow:Math.pow,

function compile(expr, vars){

}
function num(v, dflt){
  if(v===undefined||v===null||v==='') return dflt;

}
function niceStep(span, target){
  var raw=span/target, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p;
  return (m<1.5?1:m<3?2:m<7?5:10)*p;
}
function fmtNum(v){

  var s=(Math.abs(v)>=1000||Math.abs(v)<0.01)?v.toPrecision(3):String(+v.toFixed(4));
  return s.replace('-','−');
}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a||1; }

  var g=gcd(n,den), a=n/g, b=den/g, sgn=a<0?'−':''; a=Math.abs(a);

/* step spec: number, "pi/2", "π", or "auto" */

  var s=String(spec).replace(/π/g,'pi').replace(/["']/g,'');
  var m=s.match(/^\s*(\d*)\s*\*?\s*pi\s*(?:\/\s*(\d+))?\s*$/);

  var v=num(spec, NaN); if(!(v>0)) v=niceStep(span,target); return {v:v,pi:0};

/* ---------- svg helpers ---------- */
function el(tag, attrs, parent){
  var e=document.createElementNS(SVGNS,tag);
  for(var k in attrs) if(attrs[k]!==undefined&&attrs[k]!==null) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e); return e;
}
function rectOf(e){ var b=e.getBBox(); return {x:b.x,y:b.y,w:b.width,h:b.height}; }

var PALETTE=['#1a4fd0','#d32f2f','#2e7d32','#7b1fa2','#ef6c00','#00838f'];

    '<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>';

  else if(0>=x0&&0<=x1&&0>=y0&&0<=y1){ t=el('text',{x:ax-5,y:ay+fs+2,'text-anchor':'end','font-style':'italic',fill:'#333'},gLab); t.textContent='O'; labelRects.push(rectOf(t)); }

        el('line',{x1:px,y1:ay-4,x2:px,y2:ay+4,stroke:'#333','stroke-width':1.2},gAx);
        t=el('text',{x:px,y:ay+fs+3,'text-anchor':'middle',fill:'#333','font-size':fs*0.85},gLab);
        t.textContent=st.pi?fmtPi(v,st.pi):fmtNum(v); var r=rectOf(t);

      } else { var py=Y(v); if(grid) el('line',{x1:0,y1:py,x2:W,y2:py,stroke:'#ddd','stroke-width':1},gGrid);
        el('line',{x1:ax-4,y1:py,x2:ax+4,y2:py,stroke:'#333','stroke-width':1.2},gAx);
        t=el('text',{x:ax-7,y:py+fs*0.3,'text-anchor':'end',fill:'#333','font-size':fs*0.85},gLab);
        t.textContent=st.pi?fmtPi(v,st.pi):fmtNum(v); var r2=rectOf(t);
        if(labelRects.concat(pointRects).some(function(q){return overlap(q,r2)>0;})) t.remove(); else labelRects.push(r2);

      var lim=(b[1]>hi||a[1]>hi)?hi:lo; var t=(lim-a[1])/(b[1]-a[1]); return [a[0]+(b[0]-a[0])*t,lim]; };

    obstacles.push({x:0,y:py-2,w:W,h:4}); if(v.label) placeLabel(v.label,W-4,py,v.color||'#555',[[0,-6,'end'],[0,fs+4,'end']]); });

  fns.forEach(function(f){

    var seen=[]; found.forEach(function(p){
      if(p[1]<y0||p[1]>y1||seen.some(function(s){return Math.abs(s[0]-p[0])<1e-6&&Math.abs(s[1]-p[1])<1e-6;})) return; seen.push(p);
      if(seen.length>12) return;
      var px=X(p[0]), py=Y(p[1]);
      el('circle',{cx:px,cy:py,r:4.2,fill:f.color,stroke:f.color,'stroke-width':1.8},gGeo);
      obstacles.push({x:px-5,y:py-5,w:10,h:10}); pointRects.push({x:px-5,y:py-5,w:10,h:10});
      placeLabel('('+nice(p[0])+', '+nice(Math.abs(p[1])<1e-9?0:p[1])+')',px,py,f.color);
    });
    if(seen.length) note((f.label||f.expr)+' 标出的点：'+seen.map(function(p){return '('+nice(p[0])+', '+nice(Math.abs(p[1])<1e-9?0:p[1])+')';}).join('、'));
  });
  // curve labels last, where they collide with the least
  fns.forEach(function(f){ if(!f.label) return;
    var best=null;
    [0.88,0.75,0.62,0.95,0.5,0.35,0.2,0.08].forEach(function(fr){
      var p=f._pts[Math.round(fr*N)]; if(!p||!isFinite(p[1])||p[1]<y0||p[1]>y1) return;
      var r=tryLabel(f.label,X(p[0]),Y(p[1]),f.color); if(r&&(!best||r.score<best.score)) { if(best) best.el.remove(); best=r; } else if(r) r.el.remove();
    });
    if(best){ labelRects.push(best.rect); } else warn('函数 '+(f.label||f.expr)+' 的标签没地方放');
  });
  function cands(){ var g=7; return [[g,-g,'start'],[-g,-g,'end'],[g,fs+g-2,'start'],[-g,fs+g-2,'end'],[g+2,fs*0.35,'start'],[-g-2,fs*0.35,'end'],[0,-g-2,'middle'],[0,fs+g+1,'middle'],
    [2*g,-2*g,'start'],[-2*g,-2*g,'end'],[2*g,fs+2*g,'start'],[-2*g,fs+2*g,'end']]; }
  function tryLabel(text,x,y,color,cs){
    var best=null; (cs||cands()).forEach(function(c){
      var e=el('text',{x:x+c[0],y:y+c[1],'text-anchor':c[2],fill:color||'#333'},gLab); e.textContent=text;
      var r=rectOf(e), s=0, lo=0;
      labelRects.forEach(function(q){ lo+=overlap(q,r); }); s+=lo*10; obstacles.forEach(function(q){ s+=overlap(q,r); });
      if(r.x<-4||r.x+r.w>W+30||r.y<-20||r.y+r.h>H+24) s+=r.w*r.h*0.3;
      if(!best||s<best.score){ if(best) best.el.remove(); best={el:e,rect:r,score:s,lab:lo}; } else e.remove();
    }); return best;
  }
  function placeLabel(text,x,y,color,cs){ var b=tryLabel(text,x,y,color,cs); if(b){ labelRects.push(b.rect); if(b.lab>0.2*b.rect.w*b.rect.h) warn('标签「'+text+'」和别的标签重叠'); } }
  if(!skipTicks){ ticks(x0,x1,xs,true); if(!NL) ticks(y0,y1,ysz,false); }
  note('坐标范围 x∈['+fmtNum(x0)+', '+fmtNum(x1)+']，y∈['+fmtNum(y0)+', '+fmtNum(y1)+']'+(equal?'（等比例）':''));
  return svg;
}

/* ---------- svg post-processing: never clip, report overlaps ---------- */
function fitSvg(svg, widthPx, quiet){
  if(!svg.getAttribute('xmlns')) svg.setAttribute('xmlns',SVGNS);
  var vbA=svg.getAttribute('viewBox'), vb=null;
  if(vbA){ var a=vbA.trim().split(/[\s,]+/).map(Number); if(a.length===4&&a.every(isFinite)&&a[2]>0&&a[3]>0) vb={x:a[0],y:a[1],w:a[2],h:a[3]}; }
  var aw=parseFloat(svg.getAttribute('width')), ah=parseFloat(svg.getAttribute('height'));
  if(!vb&&aw>0&&ah>0&&!/%/.test(svg.getAttribute('width')||'')) vb={x:0,y:0,w:aw,h:ah};
  svg.removeAttribute('width'); svg.removeAttribute('height'); svg.style.width='600px'; svg.style.height='auto';
  if(!vb){ svg.setAttribute('viewBox','0 0 600 600'); vb={x:0,y:0,w:600,h:600}; }
  var bb; try{ var b=svg.getBBox(); bb={x:b.x,y:b.y,w:b.width,h:b.height}; }catch(e){ bb=null; }
  if(!bb||!(bb.w>0||bb.h>0)) throw new Error('SVG 里没有可见内容');
  // outward stroke/marker allowance
  var sw=0; svg.querySelectorAll('[stroke-width]').forEach(function(e){ sw=Math.max(sw,parseFloat(e.getAttribute('stroke-width'))||0); });
  var m=Math.max(sw*2, Math.max(vb.w,vb.h)*0.015, 3);
  var L=Math.min(vb.x,bb.x-m), T=Math.min(vb.y,bb.y-m), R=Math.max(vb.x+vb.w,bb.x+bb.w+m), B=Math.max(vb.y+vb.h,bb.y+bb.h+m);
  var out=[]; if(bb.x<vb.x-1) out.push('左'); if(bb.y<vb.y-1) out.push('上'); if(bb.x+bb.w>vb.x+vb.w+1) out.push('右'); if(bb.y+bb.h>vb.y+vb.h+1) out.push('下');
  if(out.length&&!quiet) note('有内容超出了 viewBox（'+out.join('、')+'侧），已自动扩大画布，没有截断');
  // generous margin all round: the capture is cropped to the drawn pixels afterwards, so this only prevents clipping
  var pad=Math.max(R-L,B-T)*0.06; L-=pad; T-=pad; R+=pad; B+=pad;
  svg.setAttribute('viewBox',[L,T,R-L,B-T].map(function(v){return +v.toFixed(2);}).join(' '));
  var base=widthPx>0?widthPx:Math.min(900,Math.max(300,vb.w)); // css px for the original viewBox width
  svg.style.width=Math.round(base*(R-L)/vb.w)+'px';
  diag.scale=(R-L)/vb.w; diag.contentFrac=(bb.w+2*m)/vb.w;
  // overlapping text labels (screen space)
  var texts=[].slice.call(svg.querySelectorAll('text')).map(function(t){ var r=t.getBoundingClientRect(); return {t:(t.textContent||'').trim(),r:{x:r.left,y:r.top,w:r.width,h:r.height}}; }).filter(function(o){return o.t&&o.r.w>0;});
  // smallest label height as a fraction of the drawing's width: the app widens the object so labels stay legible
  var px=svg.getBoundingClientRect().width/(R-L), cw=(bb.w+2*m)*px;
  var mh=texts.reduce(function(a,o){return Math.min(a,o.r.h);},1e9);
  if(texts.length&&cw>0) diag.minTextFrac=mh/cw;
  var hits=0;
  for(var i=0;i<texts.length&&hits<4;i++) for(var j=i+1;j<texts.length&&hits<4;j++){
    var a=texts[i].r, b2=texts[j].r, ov=overlap(a,b2);
    if(ov>0.12*Math.min(a.w*a.h,b2.w*b2.h)){ warn('文字「'+texts[i].t.slice(0,16)+'」和「'+texts[j].t.slice(0,16)+'」重叠'); hits++; }
  }
}

function render(kind, src, widthPx){
  diag={notes:[],warnings:[]};
  var box=document.getElementById('box');
  box.style.width=''; box.style.height=''; box.style.transform=''; box.style.paddingLeft='';
  try{
    if(kind==='latex'){
      var lines=src.split(/\n\s*\n/);
      box.style.width='';box.style.height='';box.innerHTML=lines.map(function(l){return '<div>'+texToHtml(l.trim())+'</div>';}).join('');
    } else if(kind==='geometry'||kind==='solid'){
      box.innerHTML='';
      var gs=kind==='geometry'?buildGeometry(src, box):buildSolid(src, box);
      fitSvg(gs, 0, true);
    } else if(kind==='marks'){
      box.innerHTML='';
      buildMarks(src, box);
    } else if(kind==='plot'){
      box.innerHTML='';
      var svg=buildPlot(src, box);
      fitSvg(svg, 0, true);
    } else {
      box.innerHTML=src;
      var svg2=box.querySelector('svg');
      if(!svg2) throw new Error('没有找到 <svg> 元素');
      svg2.querySelectorAll('script,foreignObject').forEach(function(e){e.remove();});
      fitSvg(svg2, widthPx);
    }
  }catch(e){
    diag.error=String(e.message||e);
    box.innerHTML='<span class="err">'+diag.error.replace(/</g,'&lt;')+'</span>';
  }
  var finish=function(){
    requestAnimationFrame(function(){
      var r=box.getBoundingClientRect();
      // measure what is really painted: KaTeX lines can overflow the box's own width
      var L=r.left, R=r.right, B=r.bottom;
      // text glyphs only (KaTeX draws radicals with very wide, clipped SVGs; .katex-mathml is invisible)
      var tw=document.createTreeWalker(box,NodeFilter.SHOW_TEXT,null,false), rg=document.createRange(), tn;
      while((tn=tw.nextNode())){ if(!tn.nodeValue.trim()||(tn.parentElement&&tn.parentElement.closest('.katex-mathml,svg'))) continue;
        rg.selectNodeContents(tn); var q=rg.getBoundingClientRect(); if(q.width>0){ L=Math.min(L,q.left); R=Math.max(R,q.right); B=Math.max(B,q.bottom); } }
      if(L<r.left-0.5){ box.style.paddingLeft=(10+Math.ceil(r.left-L))+'px'; R+=Math.ceil(r.left-L); }
      if(R>r.right+0.5||B>r.bottom+0.5){ box.style.width=Math.ceil(R-r.left+10)+'px'; box.style.height=Math.ceil(B-r.top+6)+'px'; r=box.getBoundingClientRect(); }
      var w=Math.ceil(r.width), h=Math.ceil(r.height);
      var fit=Math.min(1,(window.innerWidth-8)/Math.max(w,1),(window.innerHeight-8)/Math.max(h,1));
      box.style.transformOrigin='0 0';
      box.style.transform=fit<1?('scale('+fit+')'):'';
      requestAnimationFrame(function(){requestAnimationFrame(function(){
        Raster.done(w, h, fit, JSON.stringify(diag));
      });});
    });
  };
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(finish); } else { setTimeout(finish,100); }
}
