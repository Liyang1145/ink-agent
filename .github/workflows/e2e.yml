name: e2e-emulator
on:
  workflow_dispatch:
    inputs:
      scenario: { description: 'full | ui-only | agent', default: 'full' }
      build_run: { description: 'build-apk run id whose APK to test (empty = build here)', default: '' }
permissions:
  actions: read
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from build run
        if: ${{ github.event.inputs.build_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: InkAgent-debug
          path: apk
          run-id: ${{ github.event.inputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fixed debug signing key (so every build installs over the last and keeps data)
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then echo "$DEBUG_KEYSTORE" | base64 -d > ci-debug.keystore; fi
      - uses: actions/setup-java@v4
        if: ${{ github.event.inputs.build_run == '' }}
        with: { distribution: temurin, java-version: '17' }
      - name: Build APK
        if: ${{ github.event.inputs.build_run == '' }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          chmod +x gradlew && ./gradlew assembleDebug
          mkdir -p apk && cp app/build/outputs/apk/debug/*.apk apk/
      - name: Locate APK
        run: echo "APK=$(ls apk/*.apk | head -1)" >> $GITHUB_ENV
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/.ghcup || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator scenario
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DS_KEY: ${{ secrets.DS_KEY }}
          CLINE_KEY: ${{ secrets.CLINE_KEY }}
          CC_KEY: ${{ secrets.CC_KEY }}
          SCENARIO: ${{ github.event.inputs.scenario }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          disk-size: 4000M
          ram-size: 3072M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tests/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-out, path: e2e-out }
